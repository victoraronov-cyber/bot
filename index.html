<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят Gemini Асистент</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1a73e8;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d2e3fc;
            color: #202124;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #ffffff;
            color: #202124;
            align-self: flex-start;
            border: 1px solid #dadce0;
        }
        #input-container {
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #dadce0;
            display: flex;
            justify-content: center;
        }
        #input-box {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #dadce0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>Моят уеб асистент с Gemini</header>

    <div id="chat-container">
        <div class="message ai-message">Здравейте! Аз съм Вашият AI асистент. С какво мога да Ви помогна днес?</div>
    </div>

    <div id="input-container">
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Напишете съобщение..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Изпрати</button>
        </div>
    </div>

    <script>
        // ВАЖНО: Заменете този низ с Вашия реален Gemini API ключ
        const API_KEY = "AQ.Ab8RN6Kw8JKKMhV5oA5o4ORNb-ptZZieSQCBKi0cqe_J2JuzhQ";
        const MODEL_NAME = "gemini-2.5-flash"; // Може да използвате и друг актуален модел

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const sendButton = document.getElementById("send-btn");
            const chatContainer = document.getElementById("chat-container");
            const text = inputField.value.trim();

            if (!text) return;

            // Добавяне на съобщението на потребителя в чата
            appendMessage(text, "user-message");
            inputField.value = "";
            inputField.disabled = true;
            sendButton.disabled = true;

            // Индикатор за зареждане
            const loadingId = appendMessage("Мисля си...", "ai-message");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                const data = await response.json();
                
                // Премахване на индикатора за зареждане
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, "ai-message");
                } else {
                    appendMessage("Възникна грешка при получаване на отговор.", "ai-message");
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Грешка при връзката със сървъра.", "ai-message");
                console.error(error);
            } finally {
                inputField.disabled = false;
                sendButton.disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.id = "msg-" + Date.now() + Math.random();
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv.id;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
