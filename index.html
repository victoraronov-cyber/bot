<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebedka.bg Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1a73e8;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header button {
            background-color: white;
            color: #1a73e8;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d2e3fc;
            color: #202124;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #ffffff;
            color: #202124;
            align-self: flex-start;
            border: 1px solid #dadce0;
        }
        #input-container {
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #dadce0;
            display: flex;
            justify-content: center;
        }
        #input-box {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #1a73e8;
        }
        button.send-btn {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button.send-btn:hover {
            background-color: #1557b0;
        }
        #api-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal-content input {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .modal-content button {
            width: 100%;
            padding: 10px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- API Key Popup Modal -->
    <div id="api-modal">
        <div class="modal-content">
            <h3>Enter your Gemini API Key</h3>
            <p style="font-size: 0.9rem; color: #555;">Your key is stored safely only in your browser and is never uploaded anywhere.</p>
            <input type="password" id="modal-api-key" placeholder="Paste your API key here...">
            <button onclick="saveApiKey()">Save Key</button>
        </div>
    </div>

    <header>
        <span>Lebedka.bg Assistant</span>
        <button onclick="resetApiKey()">Change Key</button>
    </header>

    <div id="chat-container">
        <div class="message ai-message" id="welcome-msg">Зареждане...</div>
    </div>

    <div id="input-container">
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Въведете съобщение..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ==========================================================================
        // 🛠️ ТУК СА ОСНОВНИТЕ НАСТРОЙКИ НА ТВОЯ АСИСТЕНТ (РЕДАКТИРАЙ САМО ТУК):
        // ==========================================================================
        const MODEL_NAME = "gemini-3.5-flash-lite";
        
        // Инструкция за поведението и ролята на бота (можеш да променяш текста по твое желание):
        const BOT_SYSTEM_INSTRUCTION = "You are the official customer support and sales assistant for lebedka.bg контакти : +359 899 727 443 - консултация, изборд на продукт (Денислав Димитров) denislav.dimitrov@lebedka.bg ул. Буенос Айрес 22, ж.к Дианабад, София 1172 Ако не знаеш отговора на въпрос, дай контактите на Денислав Димитров. Лебедките предлагани от ЛЕБЕДКА.БГ са с 24 месеца гаранция в Европа.(a specialist store for winches, off-road equipment, towing gear, hydraulic/electric winches, synthetic ropes, and accessories). Help customers choose the right winches, explain technical specifications (such as pulling force in pounds/lbs, 12V/24V systems, steel vs synthetic ropes), and maintain a helpful, expert, and professional tone. Respond primarily in Bulgarian unless the user speaks another language. Дай този линк ако ти поискат локация https://www.google.com/maps?ll=42.660829,23.342755&z=16&t=m&hl=en-US&gl=US&mapclient=embed&q=g.k.+Dianabad,+ul.+%22Buenos+Aires%22+22+1172+Sofia . Лебедка работи в делнични дни от 9 до 5 ";
        
        // Начално съобщение при отваряне на сайта:
        const WELCOME_MESSAGE = "Здравейте! Аз съм официалният виртуален асистент на lebedka.bg. С какво мога да ви помогна относно лебедки, офроуд оборудване или аксесоари?";
        // ==========================================================================

        window.onload = function() {
            document.getElementById("welcome-msg").innerText = WELCOME_MESSAGE;
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("api-modal").style.display = "none";
            }
        }

        function saveApiKey() {
            const keyInput = document.getElementById("modal-api-key").value.trim();
            if (keyInput) {
                localStorage.setItem("gemini_api_key", keyInput);
                document.getElementById("api-modal").style.display = "none";
            } else {
                alert("Please enter a valid API key.");
            }
        }

        function resetApiKey() {
            localStorage.removeItem("gemini_api_key");
            document.getElementById("modal-api-key").value = "";
            document.getElementById("api-modal").style.display = "flex";
        }

        async function sendMessage() {
            const API_KEY = localStorage.getItem("gemini_api_key");
            if (!API_KEY) {
                alert("Please enter your API key first.");
                document.getElementById("api-modal").style.display = "flex";
                return;
            }

            const inputField = document.getElementById("user-input");
            const sendButton = document.getElementById("send-btn");
            const text = inputField.value.trim();

            if (!text) return;

            appendMessage(text, "user-message");
            inputField.value = "";
            inputField.disabled = true;
            sendButton.disabled = true;

            const loadingId = appendMessage("Пиша отговор...", "ai-message");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: BOT_SYSTEM_INSTRUCTION }]
                        },
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage(data.candidates[0].content.parts[0].text, "ai-message");
                } else if (data.error) {
                    appendMessage("Error from Google: " + data.error.message, "ai-message");
                } else {
                    appendMessage("Получен е празен отговор.", "ai-message");
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Грешка при връзката.", "ai-message");
                console.error(error);
            } finally {
                inputField.disabled = false;
                sendButton.disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.id = "msg-" + Date.now() + Math.random();
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv.id;
        }

      function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
